[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventscout"
version = "0.1.0"
description = "Self-hosted local event finder: aggregates, filters and ranks events by your interests."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "feedparser>=6.0",
    "httpx>=0.27",
    "icalendar>=6.0",
    "jinja2>=3.1",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "ruamel.yaml>=0.18",
    "recurring-ical-events>=3.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eventscout = "eventscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eventscout = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
