services:
  eventscout:
    # Published by .github/workflows/docker.yml on every push to main. `docker compose pull` fetches it;
    # `docker compose up --build` builds from this checkout instead.
    image: ghcr.io/eric-pierce/eventscout:latest
    build: .
    container_name: eventscout
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/New_York
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Sensitive values come from files in ./secrets (create them with scripts/init-secrets.sh), mounted
      # read-only at /run/secrets. EventScout reads NAME from the file named by NAME_FILE.
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      WEB_PASSWORD_FILE: /run/secrets/web_password
      EVENTSCOUT_FEED_TOKEN_FILE: /run/secrets/feed_token
      TICKETMASTER_API_KEY_FILE: /run/secrets/ticketmaster_api_key
    secrets:
      - postgres_password
      - anthropic_api_key
      - smtp_password
      - web_password
      - feed_token
      - ticketmaster_api_key
    volumes:
      - ./config.yaml:/config/config.yaml   # writable: Settings and Sources in the dashboard save here (chown 1000 on Linux)
      - ./data:/data

  # All EventScout data (events, sources, caches, run history). Not exposed outside the compose network.
  # Backup: docker compose exec postgres pg_dump -U eventscout eventscout > eventscout.sql
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventscout
      POSTGRES_USER: eventscout
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password   # read only when the volume is first initialised
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql   # Postgres 18 images keep data under /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventscout -d eventscout"]
      interval: 5s
      timeout: 5s
      retries: 30
    # ports: ["127.0.0.1:5432:5432"]   # uncomment to reach it from the host (psql, backups, local dev)

  # --- Optional services (enable with --profile) --------------------------------

  # Local LLM: `docker compose --profile local-llm up -d`, then
  #   docker compose exec ollama ollama pull qwen3:14b
  # and set llm.provider: ollama in config.yaml.
  # For NVIDIA GPUs uncomment the deploy block.
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Self-hosted metasearch used for source discovery when not using Claude web search.
  searxng:
    image: searxng/searxng:latest
    profiles: [search, local-llm]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-please}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Headless Chrome for JS-rendered calendars (sources with options: { render: true }).
  # Set BROWSERLESS_URL=http://browserless:3000 and BROWSERLESS_TOKEN in .env.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    profiles: [browser]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # localhost only, for running EventScout outside Docker
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-}
      CONCURRENT: 2

# One file per secret; an empty file means "not used". scripts/init-secrets.sh creates them: the folder is
# chmod 700 (only you can open it on the host) and the files 644 (so both the eventscout and postgres containers,
# which run as different users, can read their mounts).
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  smtp_password:
    file: ./secrets/smtp_password
  web_password:
    file: ./secrets/web_password
  feed_token:
    file: ./secrets/feed_token
  ticketmaster_api_key:
    file: ./secrets/ticketmaster_api_key

volumes:
  postgres:
  ollama:
